<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Professional gradient background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#495057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#636e72;stop-opacity:1" />
    </linearGradient>
    
    <!-- Fun shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Playful rounded background -->
  <rect width="512" height="512" fill="url(#bg-gradient)" rx="120"/>
  
  <!-- Cute panda face (simplified) -->
  <g transform="translate(256, 180)">
    <!-- Face -->
    <circle cx="0" cy="0" r="80" fill="#ffffff" filter="url(#shadow)"/>
    
    <!-- Ears -->
    <circle cx="-55" cy="-45" r="28" fill="#2d3436"/>
    <circle cx="55" cy="-45" r="28" fill="#2d3436"/>
    
    <!-- Eyes (playful) -->
    <ellipse cx="-25" cy="-8" rx="18" ry="22" fill="#2d3436"/>
    <ellipse cx="25" cy="-8" rx="18" ry="22" fill="#2d3436"/>
    <circle cx="-20" cy="-12" r="6" fill="#ffffff"/>
    <circle cx="30" cy="-12" r="6" fill="#ffffff"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="15" rx="12" ry="10" fill="#2d3436"/>
    
    <!-- Smile -->
    <path d="M -20,25 Q 0,35 20,25" stroke="#2d3436" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Rosy cheeks -->
    <circle cx="-45" cy="15" r="10" fill="#ff7675" opacity="0.4"/>
    <circle cx="45" cy="15" r="10" fill="#ff7675" opacity="0.4"/>
  </g>
  
  <!-- Philippine Peso sign in a cute badge -->
  <g transform="translate(380, 160)">
    <circle cx="0" cy="0" r="35" fill="#ffeaa7" filter="url(#shadow)"/>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2d3436" text-anchor="middle">₱</text>
  </g>
  
  <!-- LovaLog text - fun and chunky -->
  <text x="256" y="330" font-family="'Comic Sans MS', 'Fredoka', 'Rounded', sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1" filter="url(#shadow)">
    Lova<tspan fill="#fdcb6e">Log</tspan>
  </text>
  
  <!-- Store Price Ledger subtitle -->
  <text x="256" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.9">
    Store Price Ledger
  </text>
  
  <!-- Decorative stars -->
  <g fill="#ffeaa7" opacity="0.8">
    <path d="M 100,280 L 105,295 L 120,295 L 108,304 L 113,319 L 100,310 L 87,319 L 92,304 L 80,295 L 95,295 Z" transform="scale(0.6)"/>
    <path d="M 350,280 L 355,295 L 370,295 L 358,304 L 363,319 L 350,310 L 337,319 L 342,304 L 330,295 L 345,295 Z" transform="scale(0.5)"/>
    <path d="M 450,360 L 455,375 L 470,375 L 458,384 L 463,399 L 450,390 L 437,399 L 442,384 L 430,375 L 445,375 Z" transform="scale(0.4)"/>
  </g>
  
  <!-- Fun ledger notebook lines behind text -->
  <g opacity="0.15">
    <line x1="100" y1="400" x2="412" y2="400" stroke="#ffffff" stroke-width="2"/>
    <line x1="100" y1="420" x2="412" y2="420" stroke="#ffffff" stroke-width="2"/>
    <line x1="100" y1="440" x2="412" y2="440" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>